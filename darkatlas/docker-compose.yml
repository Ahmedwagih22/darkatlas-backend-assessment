version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: darkatlas
      POSTGRES_PASSWORD: darkatlas
      POSTGRES_DB: darkatlas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darkatlas"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
